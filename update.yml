name: Update DART financial data

on:
  schedule:
    - cron: '10 0 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Collect and analyze DART data
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python src/agent.py --start-year 2010 --end-year auto

      - name: Commit updated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data public/data.json
          git diff --cached --quiet || git commit -m "chore: update DART financial data"
          git push
